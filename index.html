<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>FRAME//PLAY</title>
  <meta name="description" content="Photograph your room. Play it.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="top" id="top">
      <span class="brand">FRAME//PLAY</span>
      <span class="lap" id="lap"></span>
      <nav class="road" id="road" aria-label="Steps"></nav>
    </header>
    <main id="main" tabindex="-1">
      <p>Loading the sample room&hellip;</p>
    </main>
    <div class="tour-strip" id="tour-strip" aria-live="polite"></div>
    <aside class="drawer" id="drawer" aria-label="Settings" hidden></aside>
    <footer class="dock" id="dock"></footer>
  </div>
  <p class="sr-only" id="live" aria-live="polite" aria-atomic="true"></p>
  <dialog class="card" id="card" aria-labelledby="card-title"></dialog>
  <noscript><p>FRAME//PLAY needs JavaScript to draw and play the room.</p></noscript>
</body>
</html>
